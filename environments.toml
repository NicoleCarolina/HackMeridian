# ORIGINAL: development utilizaba una red Stellar local.
#
# [development.network]
# rpc-url = "http://localhost:8000/rpc"
# network-passphrase = "Standalone Network ; February 2017"
# run-locally = true # automatically start the local network container, if not already running

# CAMBIO: hacemos que el entorno development utilice Stellar Testnet.
[development.network]
rpc-url = "https://soroban-testnet.stellar.org"
network-passphrase = "Test SDF Network ; September 2015"


[[development.accounts]]
name = "me" # Required. Keys for this account will be saved to `./.stellar/identity`
default = true # Optional. Whether to use this account as the `--source` for commands that need one.

[development.contracts]
# Los ejemplos de OpenZeppelin del taller original ya no se despliegan.

[development.contracts.dca_platform]
# Genera el cliente TypeScript (src/contracts) y despliega en testnet.
client = true
# admin = tu cuenta, treasury = tu cuenta (recibe las comisiones), fee 0,5 % (50 bps).
# router: PLACEHOLDER (`me`). Hasta fijar el router real de Soroswap en testnet,
# `execute` fallará. Cuando lo tengas verificado: `set_router --router C...`.
constructor_args = """
--admin me
--treasury me
--router me
--fee_bps 50
"""

# Coming Soon: Specify live contracts to bind & import in this project using the given name.
# During initialization, these contracts will also be "spooned" into the development network,
# meaning that their data will match the live network at the given sequence number.
# [development.contracts.eurc]
# environment = "production"
# address = "C..."
# at-ledger-sequence = 50153603

### Staging environment configuration
[staging.network]
rpc-url = "https://soroban-testnet.stellar.org"
network-passphrase = "Test SDF Network ; September 2015"

[[staging.accounts]]
name = "testnet-user"
default = true

[staging.contracts]
# soroban-atomic-swap-contract = { id = "C123..." }
# soroban-auth-contract = { id = "C234..." }
# soroban-errors-contract = { id = "C345..." }
# soroban-hello-world-contract = { id = "C456..." }
# soroban-increment-contract = { id = "C567..." }
# soroban-token-contract = { id = "C678..." }
# eurc = { id = "C789..." }
dca_platform = { client = true, constructor_args = "--admin me --treasury me --router me --fee_bps 50" }

